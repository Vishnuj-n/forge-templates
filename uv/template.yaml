name: uv
description: "Basic uv Python project template that initializes a project, copies a .env file, and extends .gitignore

version: 0.1.0
# Commands to execute in order
# Each command is executed in the temporary workspace
commands:
  - cmd: ["uv", "init"]

# File operations
files:
  # Copy files from this template to the project
  copy:
    - files/.env
  
  # Append content to existing files
  # The target file must exist (created by commands or copy operations)
  append:
    - target: ".gitignore"
      source: "patches/gitignore.append"
